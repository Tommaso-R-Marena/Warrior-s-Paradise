name: Vendor open-licensed WWII character and vehicle GLBs

on:
  push:
    branches: [feat/authentic-rig-vehicles-terrain-gpu-20261011]
    paths:
      - "tools/assets/vendor_ww2_open_art.py"
      - "tools/assets/blender_export_ww2.py"
      - "tools/assets/ww2_open_art_sources.json"
      - ".github/workflows/vendor-ww2-open-art.yml"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: wp-vendor-ww2-convert
  cancel-in-progress: false
jobs:
  import-models:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution Blender converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          blender --version | head -3
      - name: Download and export approved open-license sources
        run: python3 tools/assets/vendor_ww2_open_art.py
      - name: Commit only converted models and provenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser/3d/assets/oga/
          if ! git diff --cached --quiet; then
            git commit -m "assets(ww2): vendor converted, attributed soldier and military vehicle meshes"
            # Source/asset conversion is deterministic. Replay on newest branch
            # head rather than overwriting concurrent gameplay implementation.
            git fetch origin feat/authentic-rig-vehicles-terrain-gpu-20261011
            git rebase origin/feat/authentic-rig-vehicles-terrain-gpu-20261011
            git push origin HEAD:feat/authentic-rig-vehicles-terrain-gpu-20261011
          fi
