name: Real browser gameplay and performance

on:
  pull_request:
    branches: [main]
    paths:
      - "browser/**"
      - "tools/tests/browser_playwright_benchmark.mjs"
      - "tools/tests/browser_playwright_ballistics.mjs"
      - "tools/tests/browser_playwright_topography.mjs"
      - "tools/tests/browser_playwright_tanks.mjs"
      - "tools/tests/browser_tank_combat_smoke.js"
      - "tools/tests/browser_grounding_materials_smoke.js"
      - "tools/tests/browser_playwright_paired.mjs"
      - ".github/workflows/browser-playwright.yml"
  push:
    branches: [main]
    paths:
      - "browser/**"
      - "tools/tests/browser_playwright_benchmark.mjs"
      - "tools/tests/browser_playwright_ballistics.mjs"
      - "tools/tests/browser_playwright_topography.mjs"
      - "tools/tests/browser_playwright_tanks.mjs"
      - "tools/tests/browser_tank_combat_smoke.js"
      - "tools/tests/browser_grounding_materials_smoke.js"
      - ".github/workflows/browser-playwright.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout comparison baseline from main
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify PBR secondary-UV mesh/lightmap integrity
        run: |
          python3 tools/assets/compile_pbr_lightmaps.py --verify browser/3d/assets/pbr/normandy-brick-face.wppbr.json
          python3 -m unittest discover -s tools/tests -p test_pbr_lightmaps.py -v
          node tools/tests/browser_pbr_lightmaps_smoke.js
      - name: Verify deterministic offline-baked scene, provenance and geometry checksums
        run: |
          python3 -m unittest discover -s tools/tests -p test_baked_art_pipeline.py -v
          python3 tools/assets/generate_baked_facade.py --check
          python3 tools/assets/compile_baked_art.py --verify browser/3d/assets/baked/normandy-stonework.wpmesh.json
          node tools/tests/browser_baked_art_smoke.js
      - name: Verify continuous grounded field road and physically sampled tank tracks
        run: node tools/tests/browser_ground_surface_smoke.js
      - name: Verify contact shadows, armored wheels and correctly tagged steel PBR
        run: node tools/tests/browser_grounding_materials_smoke.js
      - name: Verify shadow, foliage, animation and armored model budgets
        run: node tools/tests/browser_cinematic_fidelity_smoke.js
      - name: Validate terrain-anchored weathered WWII farmhouses and ivy geometry
        run: node tools/tests/browser_architectural_weathering_smoke.js
      - name: Validate optional High graphics budgets and GL state restoration
        run: node tools/tests/browser_graphics_fidelity_smoke.js
      - name: Serve the same static browser files as Cloudflare Pages
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory browser >/tmp/wp-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/3d/ >/dev/null
          if [ -d baseline-source/browser ]; then
            python3 -m http.server 8766 --bind 127.0.0.1 --directory baseline-source/browser >/tmp/wp-baseline.log 2>&1 &
            sleep 2
            curl -fsS http://127.0.0.1:8766/3d/ >/dev/null
          fi
      - name: Verify tank engine, cannon rounds and Panzer AI in Node
        run: node tools/tests/browser_tank_combat_smoke.js
      - name: Render PBR/UV lightmap material in actual WebGL2 Chromium
        run: node tools/tests/browser_playwright_pbr_lightmaps.mjs
        env:
          WP_TEST_URL: http://127.0.0.1:8765/3d/
      - name: Verify offline-baked LOD scene in actual WebGL2 Chromium
        run: node tools/tests/browser_playwright_baked_art.mjs
        env:
          WP_TEST_URL: http://127.0.0.1:8765/3d/
      - name: Drive an actual Sherman over terrain-conformal Normandy road and wet ruts
        run: node tools/tests/browser_playwright_ground.mjs
        env:
          WP_TEST_URL: http://127.0.0.1:8765/3d/
      - name: Test the deployed Sherman in real Chromium
        run: node tools/tests/browser_playwright_tanks.mjs
        env:
          WP_TEST_URL: http://127.0.0.1:8765/3d/
      - name: Verify real Chromium High sky, weathered farmhouses and masonry rigidity
        run: node tools/tests/browser_playwright_weathering.mjs
        env:
          WP_TEST_URL: http://127.0.0.1:8765/3d/
      - name: Test movement, firefights, assets, and capture actual frame times
        run: node tools/tests/browser_playwright_benchmark.mjs
        env:
          CI: "true"
          WP_TEST_URL: http://127.0.0.1:8765/3d/
      - name: Real browser bullet damage, surprise targets, headshots and farmhouse cover
        run: node tools/tests/browser_playwright_ballistics.mjs
        env:
          WP_TEST_URL: http://127.0.0.1:8765/3d/
      - name: Verify physical rocks, heightfield and movement in real Chromium
        run: node tools/tests/browser_playwright_topography.mjs
        env:
          WP_TEST_URL: http://127.0.0.1:8765/3d/
      - name: Compare Low/Medium FPS with production in same software browser
        if: github.event_name == 'pull_request'
        run: node tools/tests/browser_playwright_paired.mjs
      - name: Publish frame-time and gameplay results to workflow summary
        if: always()
        run: |
          if [ -f artifacts/benchmarks/summary.md ]; then
            cat artifacts/benchmarks/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save screenshots and JSON benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warrior-frontline-chromium-benchmark
          path: artifacts/benchmarks/
          retention-days: 14
          if-no-files-found: warn
